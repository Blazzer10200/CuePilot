name: Bug report
description: Report reproducible incorrect behavior in Workflow Looper.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Workflow Looper. Do not attach private pattern files without reviewing their contents.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 2.1.0
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the smallest reliable sequence that triggers the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include timing, shortcut, or display details that may matter. Never include passwords or secrets.
