name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify release tag and version
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          $tauriVersion = (Get-Content -Raw .\ui\src-tauri\tauri.conf.json | ConvertFrom-Json).version
          $npmVersion = (Get-Content -Raw .\ui\package.json | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path .\ui\src-tauri\Cargo.toml -Pattern '^version = "([^"]+)"$').Matches[0].Groups[1].Value
          $dotnetVersion = (Select-String -Path .\CuePilot.csproj -Pattern '<Version>([^<]+)</Version>').Matches[0].Groups[1].Value
          $versions = @(@($tauriVersion, $npmVersion, $cargoVersion, $dotnetVersion) | Sort-Object -Unique)
          if ($versions.Count -ne 1 -or $versions[0] -ne $tagVersion) {
            throw "Release tag $tagVersion does not match project versions: $($versions -join ', ')."
          }

      - name: Test engine
        run: dotnet test .\tests\CuePilot.Tests\CuePilot.Tests.csproj -c Release

      - name: Headless engine self-test
        shell: pwsh
        run: '& ".\bin\Release\net8.0-windows10.0.19041.0\win-x64\CuePilot.exe" --self-test'

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Test frontend and Rust bridge
        shell: pwsh
        run: |
          Push-Location ui
          npm test
          npm run check
          Pop-Location
          npm --prefix ui run engine:stage:release
          cargo fmt --manifest-path .\ui\src-tauri\Cargo.toml -- --check
          cargo test --manifest-path .\ui\src-tauri\Cargo.toml

      - name: Build Tauri installer
        working-directory: ui
        run: npm run tauri:build

      - name: Prepare release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $installers = @(Get-ChildItem -LiteralPath "ui\src-tauri\target\release\bundle\nsis" -Filter "*.exe")
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, found $($installers.Count)." }
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $assetName = "CuePilot-$version-Windows-x64-Setup.exe"
          $assetPath = Join-Path "release" $assetName
          Copy-Item -LiteralPath $installers[0].FullName -Destination $assetPath
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $assetPath).Hash.ToLowerInvariant()
          "$hash  $assetName" | Set-Content -Encoding ascii "release\$assetName.sha256"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = (Get-ChildItem -LiteralPath release -Filter "*.exe" -File).FullName
          $checksum = (Get-ChildItem -LiteralPath release -Filter "*.sha256" -File).FullName
          gh release create "$env:GITHUB_REF_NAME" $installer $checksum --verify-tag --generate-notes --title "CuePilot $env:GITHUB_REF_NAME"
