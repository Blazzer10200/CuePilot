name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Velopack CLI
        shell: pwsh
        run: |
          dotnet tool update -g vpk --version 1.2.0
          if ($LASTEXITCODE -ne 0) {
            dotnet tool install -g vpk --version 1.2.0
          }

      - name: Restore and build engine
        run: |
          dotnet restore .\CuePilot.sln
          dotnet build .\CuePilot.sln -c Release --no-restore

      - name: Engine tests
        run: dotnet test .\tests\CuePilot.Tests\CuePilot.Tests.csproj -c Release --no-build

      - name: Headless engine self-test
        shell: pwsh
        run: '& ".\bin\Release\net8.0-windows10.0.19041.0\win-x64\CuePilot.exe" --self-test'

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Frontend tests and checks
        working-directory: ui
        run: |
          npm test
          npm run check

      - name: Rust format and bridge tests
        run: |
          npm --prefix ui run engine:stage:release
          cargo fmt --manifest-path .\ui\src-tauri\Cargo.toml -- --check
          cargo clippy --manifest-path .\ui\src-tauri\Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path .\ui\src-tauri\Cargo.toml

      - name: Build Velopack installer and update feed
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\package-velopack.ps1

      - name: Upload Windows installer
        uses: actions/upload-artifact@v6
        with:
          name: cuepilot-windows-installer
          path: |
            release/velopack/*
            !release/velopack/.staging/**
          if-no-files-found: error
