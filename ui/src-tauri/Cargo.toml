[package]
name = "cuepilot-ui"
version = "5.1.0"
description = "CuePilot Tauri activity console"
edition = "2021"

[lib]
name = "cuepilot_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
