[package]
name = "workflow-looper-ui"
version = "0.1.0"
description = "Workflow Looper Tauri operator console"
edition = "2021"

[lib]
name = "workflow_looper_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
